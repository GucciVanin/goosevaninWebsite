name: goosewebsite

services:
  web:
    image: goosewebsite-web:latest
    container_name: goosewebsite-web
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8888"
    environment:
      ASPNETCORE_URLS: http://+:8888
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Data Source=/data/goosewebsite.db
      DataProtection__KeysPath: /data/keys
      Media__Directory: /data/uploads
      ForwardedHeaders__KnownProxies__0: 172.30.100.2
      PublicBaseUrl: https://${SITE_DOMAIN:-localhost}
      # SMTP and contact settings come from .env (see .env.example); never commit real values.
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Smtp__FromEmail: ${SMTP_FROM_EMAIL:-}
      Email__Smtp__FromName: ${SMTP_FROM_NAME:-Gustavo Couto Vanin}
      # MailerSend HTTP API: sends the templated contact emails. The sender defaults to the SMTP sender.
      Email__MailerSend__ApiKey: ${MAILERSEND_API_KEY:-}
      Email__MailerSend__FromEmail: ${MAILERSEND_FROM_EMAIL:-${SMTP_FROM_EMAIL:-}}
      Email__MailerSend__FromName: ${SMTP_FROM_NAME:-Gustavo Couto Vanin}
      Contact__RecipientEmail: ${CONTACT_RECIPIENT_EMAIL:-}
    volumes:
      - web-data:/data
    # Healthy only when the application answers and its database can be reached (GET /api/health).
    # The runtime image has no curl, so the check speaks HTTP through bash's /dev/tcp.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8888 &&
          printf 'GET /api/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      app-private:
        ipv4_address: 172.30.100.3
    restart: unless-stopped

  caddy:
    container_name: goosewebsite-caddy
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-300}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      app-private:
        ipv4_address: 172.30.100.2
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  # Verification run (TE10): unit tests, then runtime tests against web and caddy. Not started by a plain
  # `docker compose up`; scripts/verify.ps1 runs it with `--profile verify`.
  verify:
    profiles: [verify]
    image: goosewebsite-verify:latest
    container_name: goosewebsite-verify
    build:
      context: .
      dockerfile: Dockerfile.verify
    env_file: .env.verify
    environment:
      # Read-only authorization check against the mail provider; the key is never printed.
      MAILERSEND_API_KEY: ${MAILERSEND_API_KEY:-}
      CADDY_IP: 172.30.100.2
      RESULTS_DIR: /results
      # Optional narrowing for quick runs (see Docs/tests/README.md): stage prefixes, browser engines, test name.
      VERIFY_STAGES: ${VERIFY_STAGES:-}
      VERIFY_BROWSERS: ${VERIFY_BROWSERS:-}
      VERIFY_BROWSER_GREP: ${VERIFY_BROWSER_GREP:-}
    volumes:
      - ./verify-results:/results
    networks:
      app-private:
        ipv4_address: 172.30.100.4
    depends_on:
      web:
        condition: service_healthy
      caddy:
        condition: service_started

volumes:
  web-data:
  caddy-data:
  caddy-config:

networks:
  app-private:
    ipam:
      config:
        - subnet: 172.30.100.0/24

<!-- Closing strip from the mockup: the logo on the left and the "Let's connect" action on the right. -->
<footer class="gcv-footer">
  <a class="logo" href="#home" (click)="onNavigate('home', $event)" [attr.aria-label]="profile.name + ' home'">
    <app-brand-logo [size]="64" />
  </a>
  <span class="line" aria-hidden="true"></span>
  <p class="copy">© {{ year }} {{ profile.name }}</p>
  <a class="gcv-btn" href="#contact" (click)="onNavigate('contact', $event)">Let's connect <span aria-hidden="true">→</span></a>
</footer>

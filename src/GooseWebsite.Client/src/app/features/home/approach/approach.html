<!-- About: Gustavo's portrait beside the text he wrote about himself (shared/models/profile.ts). -->
<section class="gcv-section about" id="approach" aria-labelledby="about-title">
  <p class="gcv-section__label"><b>01</b> About</p>
  <div class="layout">
    <figure class="portrait">
      <img src="/brand/portrait.webp" width="360" height="360" loading="lazy" alt="Illustrated portrait of Gustavo Couto Vanin" />
      <figcaption class="caption">{{ profile.name }}</figcaption>
    </figure>
    <div class="text">
      <h2 id="about-title" class="gcv-heading gcv-heading--section">About</h2>
      <div class="profile-text">
        <p class="positioning">{{ profile.positioning }}</p>
        <p>{{ profile.bio }}</p>
        <p>{{ profile.professionalSummary }}</p>
      </div>
    </div>
  </div>
</section>

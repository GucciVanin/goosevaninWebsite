<!-- Keeps profile positioning and primary actions together at the home entry point. -->
<section class="hero page-section" id="home">
  <div class="hero-copy">
    <p class="eyebrow"><span class="status-dot"></span> {{ profile.title }} <span class="eyebrow-rule"></span> {{ profile.location }}</p>
    <h1>{{ profile.name }}<br /><em>{{ profile.positioning }}</em></h1>
    <p class="hero-intro">{{ profile.professionalSummary }}</p>
    <p class="hero-bio">{{ profile.bio }}</p>
    <div class="hero-actions">
      <button class="button button-dark" type="button" (click)="navigate.emit('contact')">Get in touch <span>↓</span></button>
      <a class="text-link" [href]="'mailto:' + profile.email">Email Gustavo <span>↗</span></a>
    </div>
  </div>
  <div class="hero-art">
    <img src="/Headshot.svg" alt="Portrait of Gustavo Couto Vanin" />
  </div>
  <div class="hero-foot"><span>Scroll to discover</span><span class="scroll-line"></span><span>{{ profile.location }} / working worldwide</span></div>
</section>

<!-- The landing hero: the animated city scene fills the section; the copy sits on the left over a dark veil. -->
<section class="gcv-hero" id="home" aria-labelledby="hero-title">
  <div class="veil"></div>

  <div class="copy">
    <p class="gcv-eyebrow"><span aria-hidden="true">- </span>Build · Break · Improve</p>
    <h1 id="hero-title" class="gcv-heading gcv-heading--hero">Software <br /><em>Engineer</em></h1>
    <span class="underline" aria-hidden="true"></span>
    <p class="intro">
      Curious mind.<br />
      Practical solutions.<br />
      Real impact.
    </p>
    <a class="gcv-btn" href="#work" (click)="onExplore($event)">Explore my work <span aria-hidden="true">→</span></a>
    <p class="sr-only">{{ profile.name }}, {{ profile.title }}, {{ profile.location }}. {{ profile.positioning }}</p>
  </div>
</section>

<!-- Skills: three diagnostic-style cards, one per area. -->
<section class="gcv-section" id="skills" aria-labelledby="skills-title">
  <p class="gcv-section__label"><b>03</b> Skills</p>
  <h2 id="skills-title" class="gcv-heading gcv-heading--section">Curious by nature. <em>Precise by practice.</em></h2>
  <ul class="areas">
    @for (area of areas; track area.title) {
      <li class="gcv-card" [style.--area]="'var(' + area.token + ')'">
        <p class="gcv-label"><span class="dot" aria-hidden="true"></span>{{ area.index }} / {{ area.title }}</p>
        <ul class="skills" [attr.aria-label]="area.title + ' skills'">
          @for (skill of area.skills; track skill) {
            <li class="gcv-chip">{{ skill }}</li>
          }
        </ul>
      </li>
    }
  </ul>
</section>
